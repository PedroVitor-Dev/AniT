name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AniT.slnx --locked-mode

      - name: Audit NuGet dependencies
        run: dotnet list AniT.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build AniT.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AniT.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "console;verbosity=normal"

      - name: Enforce coverage floor
        shell: pwsh
        run: |
          $report = Get-ChildItem tests/AniT.Tests/TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw "Coverage report was not generated." }
          [xml]$coverage = Get-Content $report.FullName
          $lineRate = [double]::Parse($coverage.coverage.'line-rate', [Globalization.CultureInfo]::InvariantCulture)
          if ($lineRate -lt 0.70) { throw "Line coverage $([math]::Round($lineRate * 100, 2))% is below the 70% release floor." }
          Write-Host "Line coverage: $([math]::Round($lineRate * 100, 2))%"

      - name: Upload coverage report
        # A falha de restore/build não produz cobertura. Nesse caso, preserve o
        # erro original em vez de criar uma segunda falha de "arquivo ausente".
        if: ${{ always() && hashFiles('tests/AniT.Tests/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tests/AniT.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
